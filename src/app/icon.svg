<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    Monogram favicon. The letter is drawn as rectangles rather than <text> so it
    renders identically everywhere, without depending on a font being present.
    A filled tile keeps the mark visible against both light and dark tab bars.
  -->
  <rect width="32" height="32" rx="7" fill="#0B0F14" />
  <g fill="#2DD4BF">
    <rect x="10" y="7" width="12" height="4" rx="1" />
    <rect x="10" y="13.5" width="8.5" height="4" rx="1" />
    <rect x="10" y="7" width="4" height="18" rx="1" />
  </g>
</svg>
